name: Voice Studio CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run API tests without model weights
        run: python -m pytest -q
      - name: Validate upstream wheel metadata compatibility (Python 3.14)
        if: matrix.python-version == '3.14'
        run: |
          python -m pip download --no-deps --only-binary=:all: chatterbox-tts==0.1.7 --dest /tmp/chatterbox-original
          python -c "from pathlib import Path; from scripts.install_chatterbox import patch_wheel; original=next(Path('/tmp/chatterbox-original').glob('*.whl')); output=Path('/tmp/chatterbox-patched'); output.mkdir(); patch_wheel(original, output / original.name)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build
        run: npm run build

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone Docker Compose configuration
        run: |
          cp backend/.env.example backend/.env
          docker compose -f docker-compose.yml config --quiet
